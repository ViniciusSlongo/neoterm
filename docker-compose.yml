# O banco do neoterm: só nesta máquina, só em 127.0.0.1.
services:
  db:
    image: postgres:17-alpine
    container_name: neoterm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neoterm
      POSTGRES_PASSWORD: neoterm
      POSTGRES_DB: neoterm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - neoterm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoterm -d neoterm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  neoterm-pgdata:
